server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA: /oidc/callback è un target di hard-navigation (il provider
    # OIDC ci reindirizza il browser direttamente), non solo client-side routing
    # — senza questo fallback nginx risponde 404 perché non esiste alcun file
    # fisico a quel percorso.
    location / {
        try_files $uri /index.html;
    }
}
