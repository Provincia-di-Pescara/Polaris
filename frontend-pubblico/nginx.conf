server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Stesso elenco di prefissi del proxy Vite in sviluppo (vite.config.ts) — le
    # chiamate API restano su path relativi (baseUrl() === ''), quindi il frontend
    # deve essere same-origin col backend anche in produzione: questo nginx fa da
    # mini-reverse-proxy verso il servizio "backend" della rete Docker interna,
    # evitando CORS/cookie cross-origin (il cookie di stato OIDC anti-CSRF è
    # same-origin per costruzione, non va introdotta complessità qui).
    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pubblico/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /stagioni {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /organismi-sportivi {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback SPA: /oidc/callback è un target di hard-navigation (il provider
    # OIDC ci reindirizza il browser direttamente), non solo client-side routing
    # — senza questo fallback nginx risponde 404 perché non esiste alcun file
    # fisico a quel percorso.
    location / {
        try_files $uri /index.html;
    }
}
