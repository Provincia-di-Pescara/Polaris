# SVILUPPO: attivato da COMPOSE_FILE=docker-compose.yml;docker-compose.override.yml
# in .env. Bind mount per hot-reload, build da Dockerfile.dev, porte DB/engine esposte.

services:

  postgres:
    ports:
      - "5432:5432"

  engine:
    image: polaris/engine:dev
    build:
      context: ./engine-go
      dockerfile: Dockerfile.dev
    # Porta interna (8081) resta identica alla produzione — deve combaciare con
    # ENGINE_URL=http://engine:8081 nel docker-compose.yml base, la rete interna
    # non cambia tra dev e prod. Solo il mapping verso l'host è dev-only.
    ports:
      - "${ENGINE_PORT:-8081}:8081"
    volumes:
      - ./engine-go:/app:delegated
      - go_mod_cache:/go/pkg/mod

  backend:
    image: polaris/backend:dev
    build:
      context: ./backend-node
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
    volumes:
      - ./backend-node/src:/app/src:delegated
      - ./backend-node/package.json:/app/package.json:ro
      - ./backend-node/tsconfig.json:/app/tsconfig.json:ro
      - backend_node_modules:/app/node_modules
      - documenti_associazioni_dev:/data/documenti

  frontend-pubblico:
    image: polaris/frontend-pubblico:dev
    build:
      context: ./frontend-pubblico
      dockerfile: Dockerfile.dev
    environment:
      # Il servizio "backend" è raggiungibile per nome solo dentro la rete Docker
      # interna — vedi il commento gemello in frontend-pubblico/vite.config.ts.
      VITE_BACKEND_PROXY_TARGET: http://backend:8080
    # Nome env DISTINTO da FRONTEND_PUBBLICO_PORT del docker-compose.yml base: i
    # campi lista come "ports" si concatenano tra file compose, non si sostituiscono
    # — riusare la stessa variabile con default diverso avrebbe lasciato attivo
    # anche il mapping prod (porta 80, nginx non gira in dev) insieme a questo.
    ports:
      - "${FRONTEND_PUBBLICO_DEV_PORT:-5174}:5174"
    volumes:
      - ./frontend-pubblico/src:/app/src:delegated
      - ./frontend-pubblico/index.html:/app/index.html:ro
      - ./frontend-pubblico/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend-pubblico/tsconfig.json:/app/tsconfig.json:ro
      - frontend_pubblico_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

  frontend-backoffice:
    image: polaris/frontend-backoffice:dev
    build:
      context: ./frontend-backoffice
      dockerfile: Dockerfile.dev
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:8080
    ports:
      - "${FRONTEND_BACKOFFICE_DEV_PORT:-5173}:5173"
    volumes:
      - ./frontend-backoffice/src:/app/src:delegated
      - ./frontend-backoffice/index.html:/app/index.html:ro
      - ./frontend-backoffice/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend-backoffice/tsconfig.json:/app/tsconfig.json:ro
      - frontend_backoffice_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  go_mod_cache:
  backend_node_modules:
  documenti_associazioni_dev:
  frontend_pubblico_node_modules:
  frontend_backoffice_node_modules:
