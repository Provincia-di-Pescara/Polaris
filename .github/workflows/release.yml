name: Release

on:
  push:
    # Solo "dev" costruisce automaticamente ad ogni commit (canale mobile ":dev",
    # "ultimo build testabile") — "master" riceve immagini SOLO da un tag esplicito
    # (vX.Y.Z pulito -> anche ":latest", vX.Y.Z-id pre-release -> ":dev" pinnato).
    # Deciso 2026-08-24: il vecchio trigger su ogni push a master produceva una
    # build completa per ogni singolo commit, anche quelli minori — troppo per un
    # ramo che riceve solo merge verso una release, mai commit di lavoro diretti.
    branches: [dev]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  # L'org (Provincia-di-Pescara) ha maiuscole nel nome: ghcr.io rifiuta namespace non
  # lowercase. Hardcoded invece di derivarlo da github.repository — stesso gotcha
  # incontrato e documentato da Comune-di-Montesilvano/ComunicaPA per lo stesso motivo.
  NAMESPACE: provincia-di-pescara

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - immagine: polaris-engine
            context: engine-go
            dockerfile: engine-go/Dockerfile
          - immagine: polaris-backend
            # Contesto = radice del repo (non backend-node/): il Dockerfile copia anche
            # db/migrations/ — le migration girano nell'entrypoint del container stesso
            # ad ogni avvio (Postgres di produzione su rete privata, non raggiungibile
            # da un runner GitHub-hosted — vedi docs/claude/cicd-docker.md).
            context: .
            dockerfile: backend-node/Dockerfile
          - immagine: polaris-frontend-pubblico
            context: frontend-pubblico
            dockerfile: frontend-pubblico/Dockerfile
          - immagine: polaris-frontend-backoffice
            context: frontend-backoffice
            dockerfile: frontend-backoffice/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determina i tag dell'immagine
        id: tag
        run: |
          IMMAGINE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.immagine }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSIONE="${GITHUB_REF#refs/tags/}"
            # Identità di build reale (BUILD_VERSION, sotto): un tag git è univoco per
            # costruzione, quindi coincide col canale stesso — nessun problema qui.
            echo "build_version=${VERSIONE}" >> "$GITHUB_OUTPUT"
            if [[ "$VERSIONE" == *-* ]]; then
              # Pre-release semver (es. v1.0.0-dev.1, v1.0.0-rc.1 — identificatore dopo il
              # trattino, https://semver.org/#spec-item-9): mai promossa a "latest", ma
              # aggiorna comunque "dev" (stesso canale floating usato dal push su master
              # sotto — "l'ultimo build testabile", indipendentemente da come è arrivato).
              echo "tags=${IMMAGINE}:${VERSIONE},${IMMAGINE}:dev" >> "$GITHUB_OUTPUT"
            else
              echo "tags=${IMMAGINE}:${VERSIONE},${IMMAGINE}:latest" >> "$GITHUB_OUTPUT"
            fi
          else
            # Push diretto sul branch "dev" (mai master, vedi trigger sopra): il
            # canale ":dev" è mobile, lo stesso nome tag copre ogni build che ci
            # passa — senza un'identità propria, footer/Sentry non potrebbero mai
            # distinguere un build dev dal successivo. Lo short SHA è l'unica
            # cosa univoca disponibile qui.
            echo "build_version=dev-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "tags=${IMMAGINE}:dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          build-args: |
            BUILD_VERSION=${{ steps.tag.outputs.build_version }}
          cache-from: type=gha,scope=${{ matrix.immagine }}
          cache-to: type=gha,mode=max,scope=${{ matrix.immagine }}
