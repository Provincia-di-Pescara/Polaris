name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  # L'org (Provincia-di-Pescara) ha maiuscole nel nome: ghcr.io rifiuta namespace non
  # lowercase. Hardcoded invece di derivarlo da github.repository — stesso gotcha
  # incontrato e documentato da Comune-di-Montesilvano/ComunicaPA per lo stesso motivo.
  NAMESPACE: provincia-di-pescara

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - immagine: polaris-engine
            context: engine-go
            dockerfile: engine-go/Dockerfile
          - immagine: polaris-backend
            context: backend-node
            dockerfile: backend-node/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determina i tag dell'immagine
        id: tag
        run: |
          IMMAGINE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.immagine }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSIONE="${GITHUB_REF#refs/tags/}"
            echo "tags=${IMMAGINE}:${VERSIONE},${IMMAGINE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMMAGINE}:dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.immagine }}
          cache-to: type=gha,mode=max,scope=${{ matrix.immagine }}

  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Applica le migration al database di produzione
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::PRODUCTION_DATABASE_URL non configurato — migration NON applicate. \
          Il runner GitHub-hosted deve poter raggiungere il Postgres di produzione: se resta \
          dietro rete privata serve un self-hosted runner (o un endpoint esposto con allowlist), \
          decisione non ancora presa. Configurare il secret quando l'infrastruttura è pronta."
            exit 0
          fi
          docker run --rm -v "$PWD/db/migrations:/migrations:ro" migrate/migrate:v4.18.1 \
            -path=/migrations -database "$DATABASE_URL" up
