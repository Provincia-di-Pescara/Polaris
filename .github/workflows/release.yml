name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  # L'org (Provincia-di-Pescara) ha maiuscole nel nome: ghcr.io rifiuta namespace non
  # lowercase. Hardcoded invece di derivarlo da github.repository — stesso gotcha
  # incontrato e documentato da Comune-di-Montesilvano/ComunicaPA per lo stesso motivo.
  NAMESPACE: provincia-di-pescara

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - immagine: polaris-engine
            context: engine-go
            dockerfile: engine-go/Dockerfile
          - immagine: polaris-backend
            # Contesto = radice del repo (non backend-node/): il Dockerfile copia anche
            # db/migrations/ — le migration girano nell'entrypoint del container stesso
            # ad ogni avvio (Postgres di produzione su rete privata, non raggiungibile
            # da un runner GitHub-hosted — vedi docs/claude/cicd-docker.md).
            context: .
            dockerfile: backend-node/Dockerfile
          - immagine: polaris-frontend-pubblico
            context: frontend-pubblico
            dockerfile: frontend-pubblico/Dockerfile
          - immagine: polaris-frontend-backoffice
            context: frontend-backoffice
            dockerfile: frontend-backoffice/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determina i tag dell'immagine
        id: tag
        run: |
          IMMAGINE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.immagine }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSIONE="${GITHUB_REF#refs/tags/}"
            echo "tags=${IMMAGINE}:${VERSIONE},${IMMAGINE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMMAGINE}:dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.immagine }}
          cache-to: type=gha,mode=max,scope=${{ matrix.immagine }}
