name: polaris

# PRODUZIONE: immagini da registry, solo volumi named, nessun bind mount.
# Per lo sviluppo vedi docker-compose.override.yml (attivato da COMPOSE_FILE in .env).
#
# Le migration (db/migrations/, naming compatibile golang-migrate) girano
# nell'entrypoint del container "backend" stesso ad ogni avvio/redeploy —
# idempotenti, serializzate da un lock Postgres se più istanze si sovrappongono.
# Postgres di produzione resta su rete privata Docker, mai raggiunto da GitHub
# Actions: vedi docs/claude/cicd-docker.md.

services:

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Postgres 18 ha cambiato convenzione: vuole un mount unico su /var/lib/postgresql
    # (poi mette i dati in una sottodirectory versionata), non più .../data come le
    # versioni precedenti — bug reale trovato qui: con .../data il container entra in
    # restart loop lamentandosi di dati "unused" al vecchio path.
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - polaris-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  engine:
    image: ghcr.io/provincia-di-pescara/polaris-engine:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PORT: "8081"
      # Sentry/GlitchTip, opzionale — vuoto = nessun reporting. APP_VERSION riusa
      # IMAGE_TAG (il tag scelto al deploy, vedi docs/RUNBOOK-deploy.md), non
      # embeddato nell'immagine: corretto anche su tag mobili (dev/latest).
      SENTRY_DSN: ${SENTRY_DSN_ENGINE:-}
      APP_VERSION: ${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polaris-net

  backend:
    image: ghcr.io/provincia-di-pescara/polaris-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Nessuna porta pubblicata sull'host: come "engine", è puramente interno alla
    # rete Docker — entrambi i frontend lo raggiungono via proxy nginx interno
    # (http://backend:8080), mai dall'esterno. Per debug diretto dell'API,
    # pubblicare temporaneamente una porta a mano (o docker compose exec).
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obbligatorio - genera con openssl rand -hex 32}
      ENGINE_URL: http://engine:8081
      # SMTP di bootstrap (solo attivazione primo admin — vedi .env.example);
      # l'SMTP operativo post-bootstrap resterà in impostazioni_sistema (DB).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      BACKOFFICE_BASE_URL: ${BACKOFFICE_BASE_URL:-}
      DOCUMENTI_STORAGE_PATH: /data/documenti
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Sentry/GlitchTip, opzionale — vedi commento gemello sul servizio "engine".
      SENTRY_DSN: ${SENTRY_DSN_BACKEND:-}
      APP_VERSION: ${IMAGE_TAG:-latest}
    volumes:
      - documenti_associazioni:/data/documenti
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_started
    networks:
      - polaris-net

  frontend-pubblico:
    image: ghcr.io/provincia-di-pescara/polaris-frontend-pubblico:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PUBBLICO_PORT:-8082}:80"
    environment:
      # Sentry/GlitchTip, opzionale — vedi commento gemello sul servizio "engine".
      # Iniettato a runtime dall'entrypoint nginx, mai a build time.
      SENTRY_DSN: ${SENTRY_DSN_PUBBLICO:-}
      APP_VERSION: ${IMAGE_TAG:-latest}
    depends_on:
      backend:
        condition: service_started
    networks:
      - polaris-net

  frontend-backoffice:
    image: ghcr.io/provincia-di-pescara/polaris-frontend-backoffice:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_BACKOFFICE_PORT:-8083}:80"
    environment:
      SENTRY_DSN: ${SENTRY_DSN_BACKOFFICE:-}
      APP_VERSION: ${IMAGE_TAG:-latest}
    depends_on:
      backend:
        condition: service_started
    networks:
      - polaris-net

  # Backup logico giornaliero (pg_dump, mai bind mount — output su volume named
  # dedicato). Rotazione 7 giornalieri/4 settimanali/6 mensili di default (immagine
  # verificata attiva e con supporto Postgres 18 al momento della scelta, luglio 2026 —
  # vedi CLAUDE.md). Secondo livello di backup (snapshot storage/VM) da valutare
  # separatamente in infrastruttura, non sostituito da questo. Restore verificato:
  # docs/RUNBOOK-backup.md.
  backup:
    image: prodrigestivill/postgres-backup-local:18-alpine
    restart: unless-stopped
    # NIENTE "user: postgres:postgres" (esempio nella doc dell'immagine): bug reale
    # trovato testando con bring-up vero — su un volume named appena creato (proprietario
    # root di default) il container non riesce a scrivere e fallisce subito con
    # "insufficient permissions". Senza override l'entrypoint gira come root e sistema
    # da sé i permessi di /backups al primo avvio.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polaris-net

volumes:
  postgres_data:
  postgres_backups:
  documenti_associazioni:

networks:
  polaris-net:
    driver: bridge
