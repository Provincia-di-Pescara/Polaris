server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Stesso elenco di prefissi del proxy Vite in sviluppo (vite.config.ts) — vedi
    # commento gemello in frontend-pubblico/nginx.conf per il perché del
    # same-origin verso "backend" (rete Docker interna).
    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /backoffice/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback SPA: react-router usa path reali (createBrowserRouter), un
    # refresh/deep-link su una rotta diversa da "/" senza questo fallback riceve
    # un 404 grezzo da nginx invece del router client-side.
    location / {
        try_files $uri /index.html;
    }
}
