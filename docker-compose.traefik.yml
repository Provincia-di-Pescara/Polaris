# OPZIONALE: esposizione tramite un Traefik v3 gia' in esecuzione sullo stesso host
# (provider docker), al posto delle porte FRONTEND_PUBBLICO_PORT/FRONTEND_BACKOFFICE_PORT.
#
# Uso: docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
# Portainer (stack Git): Compose path docker-compose.yml, Additional paths
# docker-compose.traefik.yml.
#
# Variabili dello stack:
#   TRAEFIK_HOST_PUBBLICO    (obbligatoria) hostname del frontend pubblico, es. polaris.ente.it
#   TRAEFIK_HOST_BACKOFFICE  (obbligatoria) hostname del backoffice, es. polaris-bo.ente.it
#   TRAEFIK_BACKOFFICE_MIDDLEWARES middleware gia' definiti in Traefik da applicare al
#                            backoffice, separati da virgola (es. un ipallowlist per
#                            la sola rete interna: lan-only@docker). Default: nessuno
#   TRAEFIK_NETWORK          rete docker esterna condivisa con Traefik (default: proxy)
#   TRAEFIK_ENTRYPOINT       entrypoint HTTPS di Traefik (default: websecure)
#   TRAEFIK_ROUTER_PREFIX    prefisso di router e service, unico per istanza
#                            se piu' stack Polaris girano sullo stesso Traefik (default: polaris)
#
# TRUST_PROXY: la catena e' Traefik -> nginx del frontend -> backend, due proxy su reti
# Docker private: 'uniquelocal' (10/8, 172.16/12, 192.168/16) li copre entrambi anche
# quando gli IP dei container cambiano.
#
# TLS: tls=true usa il certificato di default di Traefik (o il resolver configurato
# sull'entrypoint). FRONTEND_PUBBLICO_BASE_URL e BACKOFFICE_BASE_URL vanno impostate
# a https://<TRAEFIK_HOST_PUBBLICO> e https://<TRAEFIK_HOST_BACKOFFICE>.

x-traefik-pubblico: &traefik-pubblico
  - traefik.enable=true
  - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
  - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-polaris}-pubblico.rule=Host(`${TRAEFIK_HOST_PUBBLICO:?TRAEFIK_HOST_PUBBLICO obbligatoria}`)
  - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-polaris}-pubblico.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
  - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-polaris}-pubblico.tls=true
  - traefik.http.services.${TRAEFIK_ROUTER_PREFIX:-polaris}-pubblico.loadbalancer.server.port=80

x-traefik-backoffice: &traefik-backoffice
  - traefik.enable=true
  - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
  - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-polaris}-backoffice.rule=Host(`${TRAEFIK_HOST_BACKOFFICE:?TRAEFIK_HOST_BACKOFFICE obbligatoria}`)
  - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-polaris}-backoffice.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
  - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-polaris}-backoffice.tls=true
  - traefik.http.routers.${TRAEFIK_ROUTER_PREFIX:-polaris}-backoffice.middlewares=${TRAEFIK_BACKOFFICE_MIDDLEWARES:-}
  - traefik.http.services.${TRAEFIK_ROUTER_PREFIX:-polaris}-backoffice.loadbalancer.server.port=80

services:

  frontend-pubblico:
    # Nessuna porta sull'host: si entra solo da Traefik.
    ports: !reset []
    networks:
      - polaris-net
      - traefik
    labels: *traefik-pubblico

  frontend-backoffice:
    ports: !reset []
    networks:
      - polaris-net
      - traefik
    labels: *traefik-backoffice

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
